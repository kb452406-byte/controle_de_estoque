<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Insumos</title>
  <link rel="stylesheet" href="./css/home.css">

  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="./js/auth.js"></script>
  <script>

    // Protege a rota: redireciona para login se não estiver autenticado
    verificarAutenticacao();
  </script>
</head>

<body>

  <div class="container">

    <!-- MENU DE CATEGORIAS -->
    <aside class="sidebar">
      <div class="menu-section">
        <button onclick="window.location.href='produtos.html'" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; font-size: 16px; color: #555; font-weight: bold; border-bottom: 1px solid #d8cfc2; padding: 10px 0; cursor: pointer;">
          PRODUTOS
        </button>
      </div>

      <div class="menu-section" style="margin-top: 15px;">
        <button onclick="toggleMenu(this)" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; font-size: 16px; color: #555; font-weight: bold; border-bottom: 1px solid #d8cfc2; padding: 10px 0; cursor: pointer;">
          INSUMOS <i class="bi bi-chevron-down"></i>
        </button>
        <ul style="display: block;">
          <li class="active" onclick="setCategoria('Todos', this)">Todos Insumos</li>
          <li onclick="setCategoria('Botânicos e Especiarias', this)">Botânicos e Especiarias</li>
          <li onclick="setCategoria('Fragrâncias', this)">Fragrâncias / Essências</li>
          <li onclick="setCategoria('Bases e Químicos', this)">Bases e Químicos</li>
        </ul>
      </div>

      <button class="btn-lateral" style="margin-top: 30px;" onclick="abrirModal()">+ Novo Insumo</button>
      <button class="btn-lateral" style="margin-top: 10px; background: #f2c6c6;" onclick="logout()">Sair</button>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

      <!-- BUSCAR INSUMO  -->
      <header>
        <div id="nome-usuario" style="font-size: 1.2rem; color: #555; margin-bottom: 10px; font-weight: 500;"></div>
        <h1>INSUMOS</h1>
        <input type="text" placeholder="Buscar insumo..." id="buscar">
      </header>

      <!-- BOTÃO ADICIONAR -->
      <div class="buttons" style="width: 100%;">
        <button class="btn verde" id="btn-add-insumo" onclick="abrirModal()">Adicionar Insumo</button>
      </div>

      <!-- TABELA DE INSUMOS -->
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Insumo</th>
              <th>Qtd</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Ultima Alteração</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela">
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <!-- MODAL ADICIONAR INSUMO -->
  <div id="modal-add" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <h2>Adicionar Insumo</h2>
      
      <div class="form-group">
        <label>Nome do Insumo:</label>
        <input type="text" id="add-nome" placeholder="Ex: Extrato de Anis, Álcool Cereais">
      </div>

      <div class="form-group">
        <label>Categoria:</label>
        <select id="add-categoria">
          <option value="Botânicos e Especiarias">Botânicos e Especiarias</option>
          <option value="Fragrâncias">Fragrâncias / Essências</option>
          <option value="Bases e Químicos">Bases e Químicos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo (Unidade):</label>
        <select id="add-tipo">
          <option value="ML">Mililitros (ML)</option>
          <option value="L">Litros (L)</option>
          <option value="KG">Quilos (KG)</option>
          <option value="GR">Gramas (GR)</option>
          <option value="UN">Unidade (UN)</option>
        </select>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Quantidade Inicial:</label>
          <input type="number" id="add-qtd" placeholder="0">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Custo Estimado (R$):</label>
          <input type="number" step="0.01" id="add-valor" placeholder="0.00">
        </div>
      </div>

      <button class="btn-salvar" onclick="salvarNovoItem()">Salvar Insumo</button>
    </div>
  </div>

  <script src="./js/insumos.js"></script>
</body>

</html>
