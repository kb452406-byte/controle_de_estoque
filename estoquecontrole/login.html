<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Estoque — Login</title>
  <link rel="stylesheet" href="./css/login.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;600&display=swap"
    rel="stylesheet" />

</head>

<body>

  <div class="wrapper">

    <main class="main">
      <div class="main-header">
        <h1 class="main-title">Bem-vinda de volta</h1>
        <p class="main-subtitle">Faça login para acessar seu estoque</p>
      </div>

      <div class="form-wrapper">
        <div id="msg" class="msg"></div>

        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Digite seu usuário..." autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha..." autocomplete="current-password" />
        </div>

        <div class="form-extras">
          <label class="remember">
            <input type="checkbox" id="remember" /> Lembrar de mim
          </label>
          <span class="forgot" onclick="showForgot()">Esqueci a senha</span>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
          <button class="btn btn-secondary" onclick="handleRegister()">Cadastrar</button>
          
        </div>

        <div class="divider">acesso seguro</div>
      </div>
    </main>
  </div>

  <script src="./js/auth.js"></script>
  <script>
    // Verifica se já possui sessão ativa
    redirecionarSeLogado();

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      setTimeout(() => { el.className = 'msg'; }, 3500);
    }

    async function handleLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) {
        showMsg('Por favor, preencha usuário e senha.', 'error');
        return;
      }
      
      if (await login(u, p)) {
        showMsg('Entrando no sistema…', 'success');
        setTimeout(() => { window.location.href = 'produtos.html'; }, 800);
      } else {
        showMsg('Usuário ou senha incorretos.', 'error');
      }
    }

    function handleRegister() {
      showMsg('Redirecionando para cadastro…', 'success');
      setTimeout(() => { window.location.href = 'cadastro.html'; }, 800);
    }

    function handleGuest() {
      showMsg('Acessando como visitante…', 'success');
    }

    function showForgot() {
      showMsg('Enviaremos as instruções para o seu e-mail.', 'success');
    }


    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>

</html>
