<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=d evice-width, initial-scale=1.0" />
    <title> Meu Estoque - Login </title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;600&display=swap"
        rel="stylesheet" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #1a1a1a;
            --bg-card: #f5f0e8;
            --bg-sidebar: #e8e0d0;
            --accent-pink: #e8b4b8;
            --accent-beige: #d4c5a9;
            --text-dark: #2c2c2c;
            --text-mid: #6b6b6b;
            --border: #d0c8b8;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'lato', sans-serif;
            padding: 20px;
        }

        /*testura do subtítulo*/
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            grid-template-columns: 260px 1fr;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.25);
            animation: fadeup 0.6s ease both;
        }

        @keyframes ffadeup {
            from {
                opacity: 0;
                transform: translateY(0);
            }
        }

        /*sidebar*/
        .sidebar {
            background: var(--bg-sidebar);
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 1px solid var(--border);
        }

        .sidebar-title {
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 16px;
        }

        .siderbar-item {
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-mid);
            cursor: default;
            transition: background 0.2s;
            opacity: 0.5;
        }

        .sidebar-item.active {
            background: #ddd8ce;
            color: var(--text-dark);
            opacity: 1;
        }

        .sidebar-footer {
            margin-top: auto;
            background: #ddd8ce;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-mid);
            text-align: center;
            opacity: 0.5;


        }

        /*main*/
        .main {
            padding: 48px 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;

        }

        .main-header {
            margin-bottom: 36px;

        }

        .main-titla {
            font-family: 'playfair Display', serif;
            font-size: 28px;
            color: var(--text-dark);
            letter-spacing: 0.02em;
        }

        .main-subtitle {
            font-size: 13px;
            color: var(--text-mid);
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: 0.03;
        }

        .form-group {
            margin-bottom: 20px;

        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-mid);
            margin-bottom: 8px;


        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            font-family: 'lato', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #b0a898;
            box-shadow: 0 0 0 3px rgba(168, 197, 160, 0.25);

        }

        input::placeholder {
            color: #b0a898;
        }

        .form-extras {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-mid);
            cursor: pointer;

        }

        .remember input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--accent-green);
            cursor: pointer;
        }

        .forgot {

            font-size: 13px;
            color: var(--text-mid);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        .forgot:hover {
            color: var(--text-dark);
        }

        /*buttons*/
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;

        }

        .btn {
            flex: 1;
            min-width: 120px;
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'lato', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: point;
            transition: opacity 0.2s, tranform 0.15s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn-primary {
            background: var(--accent-green);
            color: var(--text-dark);
        }

        .btn-secondary {
            background: var(--accent-pink);
            color: var(--text-dark);

        }

        .btnn-tertiary {
            background: var(--accent-beige);
            color: var(--text-dark);

        }

        .diver {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 0;
            color: var(--text-mid);
            font-size: 12px;
            letter-spacing: 0.06em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .msg.error {
            background: #fde8e8;
            color: #9b3a3a;
            border: 1px solid #f5c2c2;
            display: block;
        }

        .msg.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
        }

        @media (max-width: 580px) {
            .wrapper {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .main {
                padding: 36px 28px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-title">Meu estoque</div>
            <div class="sidebar-item active">Meu Estoque</div>
            <div class="sidebar-item">Perfumes</div>
            <div class="sidebar-item">Indiárias</div>
            <div class="sidebar-item">Cestinhas</div>
            <div class="sidebar-item">Óleos</div>
            <div class="sidebar-footer">+ Novo Perfume</div>
        </aside>
        <!-- MAIN LOGIN -->
        <main class="main">
            <div class="main-header">
                <h1 class="main-title">Bem-vinda de volta</h1>
                <p class="main-subtitle">Faça login para acessar seu estoque</p>
            </div>

            <div id="msg" class="msg"></div>

            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário..." autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha..."
                    autocomplete="current-password" />
            </div>

            <div class="form-extras">
                <label class="remember">
                    <input type="checkbox" id="remember" /> Lembrar de mim
                </label>
                <span class="forgot" onclick="showForgot()">Esqueci a senha</span>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="handleLogin()">Entrar</button>
                <button class="btn btn-secondary" onclick="handleRegister()">Cadastrar</button>
                <button class="btn btn-tertiary" onclick="handleGuest()">Visitante</button>
            </div>

            <div class="divider">acesso seguro</div>
        </main>
    </div>

    <script>
        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
            setTimeout(() => { el.className = 'msg'; }, 3500);
        }

        function handleLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) {
                showMsg('Por favor, preencha usuário e senha.', 'error');
                return;
            }
            showMsg('Entrando no sistema…', 'success');
            // Aqui você conecta com sua lógica de autenticação
        }

        function handleRegister() {
            showMsg('Redireciondo para cadastro…', 'success');
        }

        function handleGuest() {
            showMsg('Acessando como visitante…', 'success');
        }

        function showForgot() {
            showMsg('Enviaremos as instruções para o seu e-mail.', 'success');
        }

        // Enter key submits
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>

</html>

</div>
</body>
