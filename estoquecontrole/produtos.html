<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <link rel="stylesheet" href="./css/home.css">
  
  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="./js/auth.js"></script>

  <script>
    // Protege a rota: redireciona para login se não estiver autenticado
    verificarAutenticacao();
  </script>
</head>

<body>

  <div class="container">

    <!-- MENU LATERAL DE CATEGORIAS -->
    <aside class="sidebar">
      <div class="menu-section">
        <button onclick="toggleMenu(this)" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; font-size: 16px; color: #555; font-weight: bold; border-bottom: 1px solid #d8cfc2; padding: 10px 0; cursor: pointer;">
          PRODUTOS <i class="bi bi-chevron-down"></i>
        </button>
        <ul style="display: block;">
          <li class="active" onclick="setCategoria('Todos', this)">Todos os Produtos</li>
          <li onclick="setCategoria('Aromatizantes e Casa', this)">Aromatizantes e Casa</li>
          <li onclick="setCategoria('Cuidado Capilar', this)">Cuidado Capilar</li>
          <li onclick="setCategoria('Cuidado Corporal', this)">Cuidado Corporal</li>
          <li onclick="setCategoria('Bebidas Naturais', this)">Bebidas Naturais</li>
          <li onclick="setCategoria('Kits e Eventos', this)">Kits e Eventos</li>
        </ul>
      </div>

      <div class="menu-section" style="margin-top: 15px;">
        <button onclick="window.location.href='insumos.html'" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; font-size: 16px; color: #555; font-weight: bold; border-bottom: 1px solid #d8cfc2; padding: 10px 0; cursor: pointer;">
          INSUMOS
        </button>
      </div>

      <button class="btn-lateral" style="margin-top: 30px;" id="btn-add-lateral" onclick="abrirModal()">+ Novo Produto</button>
      <button class="btn-lateral" style="margin-top: 10px; background: #f2c6c6;" onclick="logout()">Sair</button>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

      <!-- BUSCAR PRODUTO -->
      <header>
        <input type="text" placeholder="Buscar..." id="buscar">
        <h1>PRODUTOS</h1>
      </header>

      <!-- BOTÃO ADICIONAR PRODUTO -->
      <div class="buttons">
        <button class="btn verde" id="btn-add-produto" style="width: 100%;" onclick="abrirModal()">Adicionar Produto</button>
      </div>

      <!-- TABELA DE PRODUTOS -->
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Estoque</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Categoria</th>
              <th>Ultima Alteração</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela">
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <!-- MODAL ADICIONAR PRODUTO -->
  <div id="modal-add" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <h2>Adicionar Produto</h2>
      
      <div class="form-group">
        <label>Nome do Produto:</label>
        <input type="text" id="add-nome" placeholder="Ex: Body Splash, Shampoo...">
      </div>

      <div class="form-group">
        <label>Categoria:</label>
        <select id="add-categoria">
          <option value="Aromatizantes e Casa">Aromatizantes e Casa</option>
          <option value="Cuidado Capilar">Cuidado Capilar</option>
          <option value="Cuidado Corporal">Cuidado Corporal</option>
          <option value="Bebidas Naturais">Bebidas Naturais</option>
          <option value="Kits e Eventos">Kits e Eventos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo (Unidade):</label>
        <select id="add-tipo">
          <option value="UN">Unidade (UN)</option>
          <option value="ML">Mililitros (ML)</option>
          <option value="L">Litros (L)</option>
          <option value="KG">Quilos (KG)</option>
          <option value="GR">Gramas (GR)</option>
        </select>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Quantidade:</label>
          <input type="number" id="add-qtd" placeholder="0">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Preço Venda (R$):</label>
          <input type="number" step="0.01" id="add-valor" placeholder="0.00">
        </div>
      </div>

      <button class="btn-salvar" onclick="salvarNovoItem()">Salvar Produto</button>
    </div>
  </div>

  <script src="./js/produtos.js"></script>
</body>

</html>
